spring.application.name=lab41-mongodb
spring.data.mongodb.uri=mongodb://localhost:27017/sba301_lab41

# Tao index tu @Indexed khi app khoi dong (can cho categoryId / sku)
spring.data.mongodb.auto-index-creation=true

# Hoc tap: xem query Mongo thuc te. Khong bat o production.
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Seed du lieu mau khi collection categories rong (tat bang app.seed.enabled=false)
app.seed.enabled=true
